name: Portfolio CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, typecheck, registry tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4 release commit
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # verified v4 release commit
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Report dependency audit findings
        shell: bash
        run: |
          set +e
          npm audit --json > "$RUNNER_TEMP/npm-audit.json"
          audit_status=$?
          set -e
          node <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/npm-audit.json`, "utf8"));
          const vulnerabilities = Object.fromEntries(
            Object.entries(report.vulnerabilities ?? {}).map(([name, item]) => [
              name,
              {
                severity: item.severity,
                direct: item.isDirect,
                affectedRange: item.range,
                fixAvailable: item.fixAvailable,
                advisories: (item.via ?? []).map((entry) =>
                  typeof entry === "string" ? entry : { title: entry.title, url: entry.url }
                ),
              },
            ]),
          );
          console.log("Dependency audit summary:");
          console.log(JSON.stringify({
            totals: report.metadata?.vulnerabilities ?? {},
            packages: vulnerabilities,
          }, null, 2));
          NODE
          echo "npm audit exit status: ${audit_status} (report-only; findings are not suppressed from the log)"
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Validate project registry
        run: npm run test:registry
      - name: Production build
        run: npm run build

  prepare-next-security-patch:
    name: Prepare patched framework lockfile
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/portfolio-refresh-project-links'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the PR branch for a scoped dependency update
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4 release commit
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # verified v4 release commit
        with:
          node-version: 22
          cache: npm
      - name: Update Next.js and its ESLint config to the patched release
        run: npm install --package-lock-only --ignore-scripts --save-exact next@16.4.2 eslint-config-next@16.4.2
      - name: Commit dependency manifest and lockfile updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency manifest and lockfile are already current."
            exit 0
          fi
          git commit -m "fix: patch Next.js security advisories"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
