name: Portfolio CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, typecheck, registry tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4 release commit
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # verified v4 release commit
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Report dependency audit findings
        shell: bash
        run: |
          set +e
          npm audit --json > "$RUNNER_TEMP/npm-audit.json"
          audit_status=$?
          set -e
          node <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/npm-audit.json`, "utf8"));
          const auditUnavailable = !report.metadata?.vulnerabilities;
          const auditError = report.error ?? report.message;
          const vulnerabilities = Object.fromEntries(
            Object.entries(report.vulnerabilities ?? {}).map(([name, item]) => [
              name,
              {
                severity: item.severity,
                direct: item.isDirect,
                affectedRange: item.range,
                fixAvailable: item.fixAvailable,
                advisories: (item.via ?? []).map((entry) =>
                  typeof entry === "string" ? entry : { title: entry.title, url: entry.url }
                ),
              },
            ]),
          );
          console.log(auditUnavailable ? "Dependency audit unavailable:" : "Dependency audit summary:");
          if (auditUnavailable && auditError) {
            console.log("Audit error details:");
            console.log(JSON.stringify(auditError, null, 2));
          }
          console.log(JSON.stringify({
            totals: auditUnavailable ? null : report.metadata.vulnerabilities,
            packages: vulnerabilities,
          }, null, 2));
          NODE
          echo "npm audit exit status: ${audit_status} (report-only; findings are not suppressed from the log)"
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Validate project registry
        run: npm run test:registry
      - name: Production build
        run: npm run build
